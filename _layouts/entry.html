---
layout: default
---
<article class="entry">
  <time class="entry-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  <h1 class="entry-title">{{ page.title }}</h1>
  {% if page.tags.size > 0 %}
  <span class="tags">{% for t in page.tags %}<span class="tag tag-{{ t | slugify }}">{{ t }}</span>{% endfor %}</span>
  {% endif %}
  <div class="entry-body">
    {{ content }}
  </div>
  <a class="back-link" href="{{ '/' | relative_url }}"><span aria-hidden="true">&larr;</span> All updates</a>
</article>
