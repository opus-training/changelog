---
layout: default
---
<article class="entry">
  <h1 class="entry-title">{{ page.title }}</h1>
  <time class="entry-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  <div class="entry-body">
    {{ content }}
  </div>
  <p><a href="{{ '/' | relative_url }}">← All updates</a></p>
</article>
